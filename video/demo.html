<!doctype html>
<meta charset="utf-8" />
<title>Confide</title>
<style>
  :root {
    --bg:#08090d; --fg:#c9d1de; --dim:#59647a; --bold:#f4f7fb;
    --red:#ef6b73; --grn:#63cf83; --yel:#f0c05a; --cyn:#5cc0cf; --line:#1b2030;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:var(--bg);color:var(--fg);
    font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  #stage{width:1160px}
  .fade{opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease}
  .fade.on{opacity:1;transform:none}
  .cap{color:var(--dim);font-size:15px;margin-bottom:26px}
  h1{font-size:52px;font-weight:700;letter-spacing:-.02em;color:var(--bold);margin-bottom:10px}
  .sub{color:var(--dim);font-size:18px;margin-bottom:36px}
  .lede{font-size:26px;line-height:1.5;max-width:980px}
  .lede b{color:var(--bold);font-weight:600}
  .hl{color:var(--yel)}
  .wrap{display:flex;gap:56px;align-items:center}
  .pos{font-family:ui-monospace,monospace;font-size:46px;color:var(--red);font-weight:600;min-width:300px}
  .pos .u{font-size:22px;color:var(--dim);font-weight:400;margin-left:8px}
  .eyes{display:flex;flex-wrap:wrap;gap:12px;max-width:680px}
  .eye{width:30px;height:30px;opacity:0;transition:opacity .35s ease}
  .eye.on{opacity:1}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .card{border:1px solid var(--line);border-radius:10px;padding:18px 16px;background:#0b0e15}
  .card .sym{font-size:20px;color:var(--bold);font-weight:600;margin-bottom:2px}
  .card .iss{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
  .card .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
  .card .k{color:var(--dim)}
  .card .ok{color:var(--grn)}
  .slot{margin-top:14px;padding:9px 10px;border-radius:7px;background:rgba(240,192,90,.10);
    border:1px dashed rgba(240,192,90,.45);text-align:center;font-size:13px;color:var(--yel)}
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .col{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0b0e15}
  .col h3{font-size:15px;font-weight:600;padding:13px 16px;border-bottom:1px solid var(--line)}
  .col .body{padding:18px 16px;min-height:132px;display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,monospace;font-size:19px;text-align:center;line-height:1.6}
  .col .body > div{width:100%}
  .col.you h3{color:var(--grn)} .col.pub h3{color:var(--red)}
  .nothing{color:var(--dim);font-size:15px;font-family:ui-sans-serif,system-ui,sans-serif}
  .bit{color:var(--yel);font-size:17px}
  .bens{display:flex;flex-direction:column;gap:18px}
  .ben{display:flex;gap:20px;align-items:flex-start}
  .ben .ic{flex:0 0 34px;margin-top:3px}
  .ben .tx{font-size:23px}
  .ben .tx b{color:var(--bold);font-weight:600}
  .ben .note{display:block;font-size:14px;color:var(--dim);margin-top:3px}
  pre{white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;
    line-height:1.55}
  .d{color:var(--dim)}.b{color:var(--bold);font-weight:600}.r{color:var(--red)}
  .g{color:var(--grn)}.y{color:var(--yel)}.c{color:var(--cyn)}
  .stamp{display:inline-block;background:rgba(99,207,131,.12);color:var(--grn);
    border:1px solid rgba(99,207,131,.35);border-radius:6px;padding:2px 9px;font-size:13px;margin-left:10px}
</style>
<div id="stage"></div>
<script>
const stage=document.getElementById("stage");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let SCENES=[]; window.__load=s=>{SCENES=s};

const EYE='<svg class="eye" viewBox="0 0 24 24" fill="none" stroke="#ef6b73" stroke-width="1.6">'
  +'<path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICONS={
  hide:'<svg viewBox="0 0 24 24" fill="none" stroke="#63cf83" stroke-width="1.6"><path d="M3 3l18 18"/><path d="M10.6 5.2A9.7 9.7 0 0 1 12 5c7 0 10.5 7 10.5 7a17 17 0 0 1-3.3 4.1M6.3 6.4A17 17 0 0 0 1.5 12S5 19 12 19a9.9 9.9 0 0 0 4.2-.9"/></svg>',
  prove:'<svg viewBox="0 0 24 24" fill="none" stroke="#f0c05a" stroke-width="1.6"><path d="M12 2 3 6v6c0 5 3.8 9.1 9 10 5.2-.9 9-5 9-10V6l-9-4Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="#5cc0cf" stroke-width="1.6"><circle cx="17" cy="6" r="3"/><circle cx="6" cy="12" r="3.2"/><circle cx="17" cy="18" r="3"/><path d="M9 10.6 14.2 7.4M9 13.4l5.2 3.2"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="#63cf83" stroke-width="1.6"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>',
  split:'<svg viewBox="0 0 24 24" fill="none" stroke="#5cc0cf" stroke-width="1.6"><path d="M5 20V9a4 4 0 0 1 4-4h2"/><path d="M19 20V9a4 4 0 0 0-4-4h-2"/><path d="M11 2.6 13.4 5 11 7.4"/></svg>'
};
const MA=String.fromCharCode(1), MB=String.fromCharCode(2), ESC=String.fromCharCode(27);
const CLS={"2":"d","1":"b","31":"r","32":"g","33":"y","36":"c"};
// Emphasis is marked in ONE pass, longest string first.
//
// It used to be a loop of split/join, one emphasis at a time, and that is wrong twice over. Given
// ["0", "173000 units"] it painted every 0 inside 17300000000000, and then failed to find
// "173000 units" at all, because the first pass had already threaded marker characters through it.
// The strongest pane of the published Stocklana cut therefore highlights a row of stray zeros and
// leaves the number the narration says unmarked. Found by looking at the file, on 2026-09-18;
// no check could have caught it, because every check was on the text and the bug was in the paint.
function ansi(line,em){
  if(em&&em.length){
    const q=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re=new RegExp([...em].sort((a,b)=>b.length-a.length).map(q).join("|"),"g");
    line=line.replace(re,m=>MA+m+MB);
  }
  const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let out="",open=0,last=0,m;
  const re=new RegExp(ESC+"\\[([0-9;]*)m","g");
  while((m=re.exec(line))){
    out+=esc(line.slice(last,m.index)); last=re.lastIndex;
    for(const c of m[1].split(";")){
      if(c==="0"||c===""){while(open>0){out+="</span>";open--}}
      else if(CLS[c]){out+='<span class="'+CLS[c]+'">';open++}
    }
  }
  out+=esc(line.slice(last)); while(open>0){out+="</span>";open--}
  out=out.split(MA).join('<span class="y">').split(MB).join("</span>");
  return out||"&nbsp;";
}
const put=h=>{stage.innerHTML=h;return [...stage.querySelectorAll(".fade")]};
async function reveal(els,step){for(const e of els){e.classList.add("on");await sleep(step||140)}}
async function out(hold){await sleep(hold*1000);
  [...stage.querySelectorAll(".fade")].forEach(e=>e.classList.remove("on"));await sleep(450)}

async function hero(s){
  const els=put('<div><h1 class="fade">Confide</h1>'
   +'<div class="sub fade">hold tokenized stocks without publishing your position</div>'
   +'<div class="lede fade">'+s.lede+'</div></div>');
  await sleep(80); await reveal(els,320); await out(s.hold);
}
async function leak(s){
  put('<div><div class="cap fade">You buy NVDAx through the quarter.</div>'
   +'<div class="wrap"><div class="pos fade"><span id="n">0</span><span class="u">NVDAx</span></div>'
   +'<div><div class="cap fade" style="margin-bottom:12px">and this is who can read it</div>'
   +'<div class="eyes">'+EYE.repeat(28)+'</div></div></div></div>');
  const els=[...stage.querySelectorAll(".fade")];
  await sleep(80); for(const e of els){e.classList.add("on");await sleep(200)}
  const n=stage.querySelector("#n"), eyes=[...stage.querySelectorAll(".eye")];
  const steps=[42000,96000,127000,145000,157000,166000,173000];
  for(let i=0;i<steps.length;i++){
    n.textContent=steps[i].toLocaleString();
    for(let k=0;k<4;k++){const e=eyes[i*4+k]; if(e)e.classList.add("on")}
    await sleep(540);
  }
  await out(s.hold);
}
async function slot(s){
  const set=[["NVDAx","Backed"],["TSLAx","Backed"],["NVDA.US","Backpack"],["AAPL.US","Backpack"]];
  const cards=set.map(a=>'<div class="card fade">'
    +'<div class="sym">'+a[0]+'</div><div class="iss">'+a[1]+'</div>'
    +'<div class="row"><span class="k">program</span><span>Token-2022</span></div>'
    +'<div class="row"><span class="k">confidential transfers</span><span class="ok">ON</span></div>'
    +'<div class="slot">auditor key<br><b>EMPTY</b></div></div>').join("");
  const els=put('<div><div class="cap fade">Two issuers with nothing to do with each other. '
   +'Read from mainnet just now.</div>'
   +'<div class="cards">'+cards+'</div>'
   +'<div class="lede fade" style="margin-top:30px;font-size:22px">'
   +'<b>All 1,869 of them.</b> The privacy is already shipped and nobody can use it &mdash; '
   +'the only key on offer reads <span class="hl">everyone\'s everything, forever</span>.</div>'
   +'<div class="cap fade" style="margin:14px 0 0">One issuer would be a quirk. Two, independently, '
   +'is the problem.</div></div>');
  await sleep(80); await reveal(els,180); await out(s.hold);
}
async function views(s){
  const data=[["pub","The market","<span class=\"nothing\">nothing</span>"],
    ["","A lender","<span class=\"bit\">&ldquo;covers the loan&rdquo;</span><br><span class=\"nothing\">and no more</span>"],
    ["","Your auditor","<span class=\"g\">173,000</span>"],
    ["you","You","<span class=\"g\">173,000</span>"]];
  const cols=data.map(a=>'<div class="col '+a[0]+' fade"><h3>'+a[1]+'</h3><div class="body"><div>'+a[2]+'</div></div></div>').join("");
  const els=put('<div><div class="cap fade">With Confide, the same position &mdash; seen four ways.</div>'
   +'<div class="cols">'+cols+'</div>'
   +'<div class="lede fade" style="margin-top:32px;font-size:22px">You choose <b>who</b>, <b>how much</b>, and <b>when</b>.</div></div>');
  await sleep(80); await reveal(els,220); await out(s.hold);
}
async function benefits(s){
  const rows=s.items.map(a=>'<div class="ben fade"><div class="ic">'+ICONS[a[0]]+'</div>'
    +'<div class="tx">'+a[1]+'<span class="note">'+a[2]+'</span></div></div>').join("");
  const els=put('<div><div class="cap fade">'+s.label+'</div><div class="bens">'+rows+'</div></div>');
  await sleep(80); await reveal(els,360); await out(s.hold);
}
async function evidence(s){
  const body=s.body.split("\n").map(l=>ansi(l,s.emphasis)).join("\n");
  const els=put('<div><div class="cap fade">'+s.label
   +'<span class="stamp">real output, just now</span></div><pre class="fade">'+body+'</pre></div>');
  await sleep(80); await reveal(els,220); await out(s.hold);
}
async function close(s){
  const els=put('<div><div class="lede fade" style="font-size:30px;margin-bottom:26px">'
   +'Your position is <b>yours</b>.<br>And you can still prove what you must.</div>'
   +'<div class="sub fade" style="margin:0">github.com/psyto/confide &middot; Apache-2.0</div></div>');
  await sleep(80); await reveal(els,420); await out(s.hold);
}
window.__play=async()=>{
  const t0=performance.now();
  for(const s of SCENES){
    console.log("CONFIDE_SCENE "+s.kind+" "+((performance.now()-t0)/1000).toFixed(1));
    if(s.kind==="hero")await hero(s);
    else if(s.kind==="leak")await leak(s);
    else if(s.kind==="slot")await slot(s);
    else if(s.kind==="views")await views(s);
    else if(s.kind==="benefits")await benefits(s);
    else if(s.kind==="close")await close(s);
    else await evidence(s);
  }
  const secs=(performance.now()-t0)/1000;
  console.log("CONFIDE_SECONDS "+secs.toFixed(1));
  return secs;
};
</script>
