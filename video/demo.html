<!doctype html>
<meta charset="utf-8" />
<title>Confide</title>
<style>
  :root {
    --bg:#08090d; --fg:#c9d1de; --dim:#59647a; --bold:#f4f7fb;
    --red:#ef6b73; --grn:#63cf83; --yel:#f0c05a; --cyn:#5cc0cf; --line:#1b2030;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:var(--bg);color:var(--fg);
    font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  /* The submission cut needs more than a collection of terminal panes. This treatment stays behind
     the evidence, so the facts remain legible while the film gets an actual visual field. */
  body.presentation{background:
    radial-gradient(ellipse 70% 80% at 84% 12%,rgba(43,117,137,.16),transparent 58%),
    radial-gradient(ellipse 52% 65% at 8% 88%,rgba(37,120,80,.13),transparent 64%),var(--bg)}
  body.presentation:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;
    background-image:linear-gradient(rgba(102,128,163,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(102,128,163,.05) 1px,transparent 1px);
    background-size:48px 48px;mask-image:linear-gradient(to bottom,transparent,black 17%,black 84%,transparent)}
  #stage{width:1160px}
  #mark{position:fixed;left:58px;top:44px;font-size:19px;font-weight:700;letter-spacing:-.01em;
    color:var(--bold);opacity:.55;transition:opacity .45s ease}
  body.hero #mark{opacity:0}
  #mark span{font-weight:400;color:var(--dim);margin-left:10px;letter-spacing:0}
  .fade{opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease}
  .fade.on{opacity:1;transform:none}
  .cap{color:var(--dim);font-size:15px;margin-bottom:26px}
  /* THE ONE LINE A MUTED VIEWER MUST STILL GET. This file's rule is that the narration does not read
     the screen, and this is the deliberate exception: the sentence that says what Confide does is
     spoken AND shown, because a judge skimming with the sound off would otherwise learn the outcome
     and never the product. */
  .cap.say{font-size:21px;color:var(--fg);max-width:1180px;line-height:1.45;margin-bottom:22px}
  .cap.say b{color:var(--bold);font-weight:600}
  h1{font-size:52px;font-weight:700;letter-spacing:-.02em;color:var(--bold);margin-bottom:10px}
  .sub{color:var(--dim);font-size:18px;margin-bottom:36px}
  .lede{font-size:26px;line-height:1.5;max-width:980px}
  .lede b{color:var(--bold);font-weight:600}
  /* A SENTENCE, NOT A TITLE CARD. The turn scene borrowed `hero`, and `hero` always prints
     <h1>Confide</h1> — so the name appeared a second time 45 seconds in and the film looked like it
     had restarted. A scene that is one sentence needs a renderer that draws one sentence. */
  .say-only{max-width:1200px}
  .say-only .line{font-size:34px;line-height:1.5;color:var(--fg);font-weight:500;max-width:1160px}
  .say-only .line b{color:var(--bold);font-weight:700}
  .say-only .kicker{font-size:17px;color:var(--dim);margin-bottom:30px;letter-spacing:.01em}
  /* A REGULATION IS NOT TERMINAL OUTPUT. The first cut of this scene put the order's wording into
     the `pre` pane above -- 13.5px, monospace, `white-space:pre` -- so a sentence of English ran off
     the right edge and was cut mid-word. This is the same information at reading size, wrapped,
     with the number it turns on given its own weight. */
  .order{max-width:1180px}
  /* RELIEF, THEN THE CATCH -- on screen, not only in the voice. The first version of this card was
     the publication condition quoted on its own, so a viewer with the sound off saw a rule and
     never the turn: the five years of relief that the rule is the price of. `reveal` brings these
     in one at a time, so the turn happens in the picture. */
  .order .grant{font-size:31px;line-height:1.45;color:var(--grn);font-weight:600;margin-bottom:22px}
  .order .quote{font-size:30px;line-height:1.5;color:var(--bold);font-weight:500;max-width:1100px}
  .order .quote em{font-style:normal;color:var(--y);font-weight:700}
  .order .quote .but{color:var(--dim);font-weight:400}
  .order .rule{margin-top:40px;display:flex;gap:20px;align-items:baseline}
  .order .rule .k{font-size:52px;font-weight:700;color:var(--y);line-height:1;white-space:nowrap}
  .order .rule .v{font-size:20px;line-height:1.5;color:var(--dim);max-width:720px}
  .order .rule .v b{color:var(--bold);font-weight:600}
  .hl{color:var(--yel)}
  .wrap{display:flex;gap:56px;align-items:center}
  .pos{font-family:ui-monospace,monospace;font-size:46px;color:var(--red);font-weight:600;min-width:300px}
  .pos .u{font-size:22px;color:var(--dim);font-weight:400;margin-left:8px}
  .eyes{display:flex;flex-wrap:wrap;gap:12px;max-width:680px}
  .eye{width:30px;height:30px;opacity:0;transition:opacity .35s ease}
  .eye.on{opacity:1}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .card{border:1px solid var(--line);border-radius:10px;padding:18px 16px;background:#0b0e15}
  .card .sym{font-size:20px;color:var(--bold);font-weight:600;margin-bottom:2px}
  .card .iss{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
  .card .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
  .card .k{color:var(--dim)}
  .card .ok{color:var(--grn)}
  .slot{margin-top:14px;padding:9px 10px;border-radius:7px;background:rgba(240,192,90,.10);
    border:1px dashed rgba(240,192,90,.45);text-align:center;font-size:13px;color:var(--yel)}
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .col{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0b0e15}
  .col h3{font-size:15px;font-weight:600;padding:13px 16px;border-bottom:1px solid var(--line)}
  .col .body{padding:18px 16px;min-height:132px;display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,monospace;font-size:19px;text-align:center;line-height:1.6}
  .col .body > div{width:100%}
  .col.you h3{color:var(--grn)} .col.pub h3{color:var(--red)}
  .nothing{color:var(--dim);font-size:15px;font-family:ui-sans-serif,system-ui,sans-serif}
  .bit{color:var(--yel);font-size:17px}
  .bens{display:flex;flex-direction:column;gap:18px}
  .ben{display:flex;gap:20px;align-items:flex-start}
  .ben .ic{flex:0 0 34px;margin-top:3px}
  .ben .tx{font-size:23px}
  .ben .tx b{color:var(--bold);font-weight:600}
  .ben .note{display:block;font-size:14px;color:var(--dim);margin-top:3px}
  pre{white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;
    line-height:1.55}
  .d{color:var(--dim)}.b{color:var(--bold);font-weight:600}.r{color:var(--red)}
  .g{color:var(--grn)}.y{color:var(--yel)}.c{color:var(--cyn)}
  .stamp{display:inline-block;background:rgba(99,207,131,.12);color:var(--grn);
    border:1px solid rgba(99,207,131,.35);border-radius:6px;padding:2px 9px;font-size:13px;margin-left:10px}

  /* Added for the CWF presentation cut. Nothing above is touched: the published Stocklana cut
     renders from the same file and must come out of a re-render byte-identical in layout. */
  .figs{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:20px;margin-top:22px}
  .fig{border:1px solid var(--line);border-radius:12px;background:#0b0e15;padding:20px 22px}
  .fig .n{font-family:ui-monospace,Menlo,monospace;font-size:40px;font-weight:600;letter-spacing:-.01em;
    color:var(--cyn)}
  .fig.warn .n{color:var(--red)}
  .fig .k{color:var(--dim);font-size:13.5px;margin-top:8px;line-height:1.45}
  /* The exchange, as a picture. The terminal pane that used to carry this scene showed that two
     transfers happened; what makes it a TRADE is that the two sides mirror each other, and a
     mirror is a shape rather than a list. The empty middle is doing as much work as the arrows —
     it is where a clearing house would be, and the caption names what is not there. */
  /* Narrow on purpose. At full width the before and the after sat at opposite ends of the box and
     "173,000 → 123,000" stopped reading as one movement. */
  .dvp{display:grid;grid-template-columns:minmax(0,1fr) 260px minmax(0,1fr);align-items:center;
   gap:0;margin-top:10px;max-width:1180px;margin-inline:auto}
  .dvp .party{border:1px solid var(--line);border-radius:12px;background:#0b0e15;padding:18px 22px}
  .dvp .party h3{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--dim)}
  .dvp .party .ln{display:grid;grid-template-columns:52px 1fr 20px 1fr;align-items:baseline;
   font-family:ui-monospace,Menlo,monospace;font-size:17px;line-height:2}
  .dvp .party .ln .lbl{color:var(--dim)}
  .dvp .party .ln .was{color:var(--dim);text-align:right}
  .dvp .party .ln .to{color:var(--line);text-align:center}
  .dvp .party .ln .now{text-align:right}
  .dvp .mid{text-align:center}
  .dvp .arrow{font-family:ui-monospace,Menlo,monospace;font-size:14.5px;color:var(--yel);
   white-space:nowrap;margin:7px 0}
  .dvp .arrow .bar{color:var(--line)}
  .dvp .brace{margin-top:20px;color:var(--dim);font-size:14px}
  /* The first version of this scene drew a trade that looked entirely public: every figure in
     plain sight, and confidentiality reduced to one small line underneath. The numbers on screen
     are the ones nobody outside is supposed to have, so the picture has to SHOW that they are
     enclosed. Hence a sealed container with the exchange inside it, and the public view outside. */
  .sealed{border:1px solid rgba(99,207,131,.30);border-radius:14px;padding:30px 26px 24px;
   background:rgba(99,207,131,.035);position:relative;margin-top:30px}
  .sealed .seal{position:absolute;top:-11px;left:26px;background:var(--bg);padding:0 12px;
   color:var(--grn);font-size:13.5px;letter-spacing:.02em}
  .dvp .absent{margin-top:24px;text-align:center;color:var(--dim);font-size:15px}
  .dvp .absent b{color:var(--fg)}
  .seen{margin-top:30px;display:flex;justify-content:center;align-items:center;gap:14px}
  .seen .lbl{color:var(--dim);font-size:15px;margin-right:10px}
  /* `flex` drops the track width a grid was giving these, and they collapsed to slivers. */
  .seen .z{flex:0 0 88px;border:1px solid var(--line);border-radius:9px;background:#0b0e15;
   text-align:center;padding:12px 0;color:var(--grn);font-family:ui-monospace,Menlo,monospace;
   font-size:21px}
  .miss{display:flex;flex-direction:column;gap:22px;margin-top:4px}
  .miss .row{display:flex;gap:18px;align-items:baseline}
  .miss .num{color:var(--red);font-family:ui-monospace,Menlo,monospace;font-size:19px;flex:0 0 18px}
  .miss .tx{font-size:24px;color:var(--bold);line-height:1.45}
  .miss .tx em{font-style:normal;color:var(--red);font-family:ui-monospace,Menlo,monospace;font-size:19px;
    margin-left:9px}
  .cmd{font-family:ui-monospace,Menlo,monospace;font-size:26px;color:var(--grn)}
  .cmd .p{color:var(--dim)}
  .url{font-family:ui-monospace,Menlo,monospace;font-size:26px;color:var(--cyn)}
  /* Visual-first scenes for the submission. They retain the measured values but turn conclusions
     into a picture a muted viewer can read from across the room. */
  .visual{position:relative;max-width:1160px;width:100%}
  .visual .eyebrow{font-size:15px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
  .visual h2{font-size:37px;line-height:1.18;color:var(--bold);letter-spacing:-.025em;max-width:900px}
  .visual .source{font:13px ui-monospace,monospace;color:var(--dim);margin-top:22px}
  .visual .source b{color:var(--cyn);font-weight:500}
  .metric-row{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}
  .metric-row.three{grid-template-columns:1fr 1fr 1fr;gap:18px}
  .metric-row.three .metric{min-height:176px;padding:24px 26px}
  .metric-row.three .value{font-size:60px;margin-top:20px}
  .metric{min-height:192px;padding:27px 30px;border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(135deg,rgba(19,26,40,.92),rgba(9,13,21,.76));position:relative;overflow:hidden}
  .metric:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-78px;bottom:-118px;
    background:radial-gradient(circle,rgba(92,192,207,.18),transparent 66%)}
  .metric.bad:after{background:radial-gradient(circle,rgba(239,107,115,.2),transparent 66%)}
  .metric .label{font-size:15px;color:var(--dim);position:relative;z-index:1}
  .metric .value{font-size:69px;line-height:1;color:var(--cyn);letter-spacing:-.06em;font-weight:700;margin-top:25px;position:relative;z-index:1}
  .metric.bad .value{color:var(--red)} .metric.good .value{color:var(--grn)}
  .metric .unit{font-size:18px;letter-spacing:0;color:var(--dim);margin-left:10px}
  .position{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:18px}
  .position .side{min-height:238px;border-radius:18px;padding:26px 34px;border:1px solid var(--line);position:relative;overflow:hidden}
  .position .public{background:linear-gradient(145deg,rgba(59,20,30,.70),rgba(15,11,17,.82))}
  .position .private{background:linear-gradient(145deg,rgba(14,62,49,.75),rgba(10,19,20,.85));border-color:rgba(99,207,131,.46)}
  .position .k{font-size:15px;text-transform:uppercase;letter-spacing:.11em;color:var(--dim)}
  .position .n{font-size:96px;line-height:.98;letter-spacing:-.08em;font-weight:750;margin-top:30px;color:var(--red)}
  .position .private .n{font-size:72px;color:var(--grn)}
  .position .u{font-size:20px;color:var(--fg);margin-top:12px}.position .hint{font-size:15px;color:var(--dim);margin-top:24px}
  .position .lock{position:absolute;right:32px;top:26px;width:40px;height:40px;border:1px solid rgba(99,207,131,.38);border-radius:50%;color:var(--grn);font-size:23px;text-align:center;line-height:37px}
  .adoption-foot{display:flex;gap:11px;align-items:center;margin-top:22px;font-size:16px;color:var(--dim)}
  .adoption-foot .dot{width:9px;height:9px;background:var(--red);border-radius:50%;box-shadow:0 0 15px rgba(239,107,115,.75)}
  .gap-stage{display:grid;grid-template-columns:1fr 270px 1fr;gap:24px;align-items:stretch;margin-top:34px}
  .gap-stage .capability{padding:25px;border:1px solid var(--line);border-radius:16px;background:rgba(12,17,27,.84)}
  .capability .tiny{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.capability strong{display:block;font-size:28px;color:var(--bold);margin-top:19px;line-height:1.2}
  .exts{margin-top:17px}
  .exts .ext{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
  .exts .ext:last-child{border-bottom:0}
  .exts code{font:600 18px ui-monospace,Menlo,monospace;color:var(--bold)}
  .exts span{font:13px ui-monospace,Menlo,monospace;color:var(--dim)}
  .gap-stage .missing-key{border:1px dashed rgba(240,192,90,.68);border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:rgba(82,63,20,.12)}
  .missing-key .keyhole{font-size:56px;color:var(--yel);line-height:1}.missing-key b{font-size:18px;color:var(--yel);margin-top:15px}.missing-key span{font-size:14px;color:var(--dim);margin-top:5px}
  .gate-flow{display:grid;grid-template-columns:1fr 104px 1fr;align-items:center;gap:20px;margin-top:32px}.gate-card{min-height:240px;border:1px solid var(--line);border-radius:18px;padding:27px 29px;background:rgba(12,17,27,.86)}
  .gate-card .state{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}.gate-card .icon{font-size:48px;margin-top:32px}.gate-card .result{font-size:28px;font-weight:700;margin-top:12px}.gate-card.refused{border-color:rgba(239,107,115,.42)}.gate-card.refused .result{color:var(--red)}.gate-card.approved{border-color:rgba(99,207,131,.42)}.gate-card.approved .result{color:var(--grn)}.gate-card .why{font-size:15px;color:var(--dim);margin-top:10px}.gate-arrow{color:var(--yel);font-size:42px;text-align:center}
  .amm{margin-top:30px;border:1px solid var(--line);border-radius:20px;padding:28px 31px;background:linear-gradient(135deg,rgba(12,23,31,.94),rgba(13,16,25,.82))}.amm .pool-title{font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}.reserve-row{display:grid;grid-template-columns:1fr 92px 1fr;gap:15px;align-items:center;margin-top:23px}.reserve{border:1px solid var(--line);border-radius:12px;padding:17px 20px;background:#0a0e16}.reserve .k{font-size:13px;color:var(--dim)}.reserve .v{font:600 27px ui-monospace,monospace;color:var(--cyn);margin-top:4px}.reserve.after .v{color:var(--yel)}.delta{font:600 21px ui-monospace,monospace;color:var(--red);text-align:center}.amm .deduce{font-size:27px;color:var(--bold);margin-top:27px;line-height:1.28}.amm .deduce b{color:var(--red)}
  /* THE CARD IS THE HEADLINE. THIS IS THE EVIDENCE. The visual pass replaced four panes of real
     stdout with designed cards, which reads better and proves less -- and what this submission has
     that others do not is that its numbers are measured and the render refuses when they stop being
     true. So the conclusion is drawn, and the line that establishes it is printed verbatim
     underneath, in the monospace it was emitted in. */
  .evidence{margin-top:18px;border-left:2px solid var(--line);padding:7px 0 7px 17px}
  .evidence .ev{font:13.5px/1.75 ui-monospace,Menlo,monospace;color:var(--dim);white-space:pre}
  .evidence .ev b{color:var(--fg);font-weight:500}
  .evidence .from{font-size:12.5px;color:var(--dim);opacity:.72;margin-top:7px;letter-spacing:.03em}
  /* An illustration has to look like one. See the note on ammLeak(). */
  .amm.illustrative{border-style:dashed;border-color:rgba(240,192,90,.34)}
  .amm .disclaim{font-size:15px;color:var(--yel);margin-top:4px;letter-spacing:.02em}
  .reserve .v.sym{font-size:30px;letter-spacing:.02em}
  .invite{margin-top:20px;border:1px solid rgba(99,207,131,.30);border-radius:14px;padding:15px 24px;background:rgba(18,66,49,.16)}
  .invite .cmd{font-size:26px}
  .invite .run{font-size:15.5px;color:var(--dim);margin-top:7px;max-width:1040px}
  .source .tell{color:var(--yel)}
  .check{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.check .step{border-left:3px solid var(--red);padding:15px 23px;background:rgba(59,20,30,.26);border-radius:0 12px 12px 0}.check .step.fixed{border-color:var(--grn);background:rgba(18,66,49,.25)}.check .tag{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}.check strong{display:block;font-size:23px;line-height:1.25;color:var(--bold);margin-top:6px}.check .fixed strong{color:var(--grn)}
</style>
<div id="mark">Confide<span>confidential delivery-versus-payment on Solana</span></div>
<div id="stage"></div>
<script>
const stage=document.getElementById("stage");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let SCENES=[]; window.__load=s=>{SCENES=s};

const EYE='<svg class="eye" viewBox="0 0 24 24" fill="none" stroke="#ef6b73" stroke-width="1.6">'
  +'<path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICONS={
  hide:'<svg viewBox="0 0 24 24" fill="none" stroke="#63cf83" stroke-width="1.6"><path d="M3 3l18 18"/><path d="M10.6 5.2A9.7 9.7 0 0 1 12 5c7 0 10.5 7 10.5 7a17 17 0 0 1-3.3 4.1M6.3 6.4A17 17 0 0 0 1.5 12S5 19 12 19a9.9 9.9 0 0 0 4.2-.9"/></svg>',
  prove:'<svg viewBox="0 0 24 24" fill="none" stroke="#f0c05a" stroke-width="1.6"><path d="M12 2 3 6v6c0 5 3.8 9.1 9 10 5.2-.9 9-5 9-10V6l-9-4Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="#5cc0cf" stroke-width="1.6"><circle cx="17" cy="6" r="3"/><circle cx="6" cy="12" r="3.2"/><circle cx="17" cy="18" r="3"/><path d="M9 10.6 14.2 7.4M9 13.4l5.2 3.2"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="#63cf83" stroke-width="1.6"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>',
  split:'<svg viewBox="0 0 24 24" fill="none" stroke="#5cc0cf" stroke-width="1.6"><path d="M5 20V9a4 4 0 0 1 4-4h2"/><path d="M19 20V9a4 4 0 0 0-4-4h-2"/><path d="M11 2.6 13.4 5 11 7.4"/></svg>'
};
const MA=String.fromCharCode(1), MB=String.fromCharCode(2), ESC=String.fromCharCode(27);
const CLS={"2":"d","1":"b","31":"r","32":"g","33":"y","36":"c"};
// Emphasis is marked in ONE pass, longest string first.
//
// It used to be a loop of split/join, one emphasis at a time, and that is wrong twice over. Given
// ["0", "173000 units"] it painted every 0 inside 17300000000000, and then failed to find
// "173000 units" at all, because the first pass had already threaded marker characters through it.
// The strongest pane of the published Stocklana cut therefore highlights a row of stray zeros and
// leaves the number the narration says unmarked. Found by looking at the file, on 2026-09-18;
// no check could have caught it, because every check was on the text and the bug was in the paint.
function ansi(line,em){
  if(em&&em.length){
    const q=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re=new RegExp([...em].sort((a,b)=>b.length-a.length).map(q).join("|"),"g");
    line=line.replace(re,m=>MA+m+MB);
  }
  const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let out="",open=0,last=0,m;
  const re=new RegExp(ESC+"\\[([0-9;]*)m","g");
  while((m=re.exec(line))){
    out+=esc(line.slice(last,m.index)); last=re.lastIndex;
    for(const c of m[1].split(";")){
      if(c==="0"||c===""){while(open>0){out+="</span>";open--}}
      else if(CLS[c]){out+='<span class="'+CLS[c]+'">';open++}
    }
  }
  out+=esc(line.slice(last)); while(open>0){out+="</span>";open--}
  out=out.split(MA).join('<span class="y">').split(MB).join("</span>");
  return out||"&nbsp;";
}
let CUR="";
// THE MARK IS FIXED AND THE STAGE IS CENTRED, so a tall enough scene grows up underneath the
// wordmark and the two overprint. Nothing in the page would notice: the mark is out of flow, so
// there is no reflow, no overflow, and no error -- just two strings of text in the same pixels for
// fifteen seconds. Every pane here is the output of a command, and commands grow. So the page
// measures it and says so, and the recorder refuses on it.
const put=h=>{stage.innerHTML=h;
  const st=stage.getBoundingClientRect(), mk=document.getElementById("mark").getBoundingClientRect();
  if(!document.body.classList.contains("hero") && st.top < mk.bottom+8)
    console.log("CONFIDE_OVERLAP "+CUR+" "+Math.round(mk.bottom+8-st.top));
  // EVERY FIGURE ON SCREEN CAME FROM SOMEWHERE, OR IT DID NOT. A scene once drew a pool -- 1,000,000
  // shares, minus 50,000, 950,000 -- in the same type as 469,477 and 173,000, which are measured.
  // Nothing in the page could tell them apart and neither could a judge. So the page reports the
  // figures it is about to show and the recorder checks each one against the output it ran.
  const nums=[...new Set((stage.innerText||"").match(/\d{1,3}(?:,\d{3})+/g)||[])];
  if(nums.length)console.log("CONFIDE_FIGURES "+CUR+"\t"+nums.join(" "));
  return [...stage.querySelectorAll(".fade")]};
async function reveal(els,step){for(const e of els){e.classList.add("on");await sleep(step||140)}}
async function out(hold){await sleep(hold*1000);
  [...stage.querySelectorAll(".fade")].forEach(e=>e.classList.remove("on"));await sleep(450)}
// Two ways to say how long a scene lasts, and they mean different things.
//
//   hold  — seconds to sit still AFTER the scene has finished arriving. What the published
//           Stocklana cut was timed with, one scene at a time, by watching it.
//   total — seconds for the whole scene, arrival and fade included. What the CWF presentation
//           uses, because its durations are derived from the narration's word counts and the
//           narration does not care how long a card took to fade in.
//
// A scene passing `total` subtracts whatever its own animation already spent. Doing that
// arithmetic in the recorder instead would mean the recorder knowing how long each kind of scene
// takes to arrive — the same number in two files, which is the drift this repository keeps having.
const rest=(s,t0)=>s.total==null?s.hold:Math.max(0,s.total-(performance.now()-t0)/1000-0.45);

// Numbered gaps, one per beat. Slower than a bullet list on purpose: this is the scene a viewer
// is most likely to think was hidden, so each line gets long enough to be read and disbelieved.
async function missing(s){
  const t0=performance.now();
  put('<div><div class="cap fade">'+s.label+'</div><div class="miss">'
   +s.items.map((t,i)=>'<div class="row fade"><div class="num">'+(i+1)+'</div>'
     +'<div class="tx">'+t+'</div></div>').join("")+'</div></div>');
  const all=[...stage.querySelectorAll(".fade")];
  // THE STEP IS DERIVED FROM THE HOLD, not declared beside it. It was a constant twice, and twice
  // the picture decided the scene's length: adding a fourth item ran 28 s against a script asking
  // for 24, and trimming the narration then left the animation 3 s long again. The script owns the
  // clock -- `total` comes from pace.py, which derives it from the words -- so the reveal fits
  // inside whatever that is, and `step` is only a ceiling for short lists.
  const lead=s.lead??4.5;
  const n=all.length-1;
  const room=Math.max(0,(s.total??0)-lead-0.9);
  const step=n>0?Math.min(s.step??7,room/n):0;
  all[0].classList.add("on"); await sleep(lead*1000);
  for(const e of all.slice(1)){ e.classList.add("on"); await sleep(step*1000) }
  await out(rest(s,t0));
}
