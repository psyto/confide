[package]
name = "mora-embargo"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A self-opening embargo: a disclosure the holder can neither accelerate nor prevent"

[dependencies]
# Arm's-length versioned dependency, as aperture's own README prescribes.
aperture-core = { git = "https://github.com/psyto/aperture", tag = "v0.5.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"

[dev-dependencies]
serde_json = "1"
solana-zk-sdk = "7"
