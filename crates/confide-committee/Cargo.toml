[package]
name = "confide-committee"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The release committee as actual processes — a committee inside one process is not a committee"

[[bin]]
name = "confide-seal"
path = "src/seal.rs"

[[bin]]
name = "confide-agent"
path = "src/agent.rs"

[[bin]]
name = "confide-open"
path = "src/open.rs"

[dependencies]
confide-embargo = { path = "../confide-embargo" }
confide-equity = { path = "../confide-equity" }
aperture-core = { git = "https://github.com/psyto/aperture", tag = "v0.5.1" }
solana-zk-sdk = "7"
serde_json = "1"
