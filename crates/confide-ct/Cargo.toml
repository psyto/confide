[package]
name = "confide-ct"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Provision Token-2022 confidential accounts whose ElGamal key we hold, and fill the auditor slot"

[lib]
name = "confide_ct"
path = "src/lib.rs"

[[bin]]
name = "prove-collateral"
path = "src/prove_collateral.rs"

[[bin]]
name = "read-balance"
path = "src/read_balance.rs"

[[bin]]
name = "provision"
path = "src/provision.rs"

[[bin]]
name = "set-auditor"
path = "src/set_auditor.rs"

[[bin]]
name = "build-seizure-proofs"
path = "src/build_seizure_proofs.rs"

[[bin]]
name = "seizure-ctx"
path = "src/seizure_ctx.rs"

[[bin]]
name = "lender-check"
path = "src/lender_check.rs"

[[bin]]
name = "build-deshield-proofs"
path = "src/build_deshield_proofs.rs"

[[bin]]
name = "seizure-client"
path = "src/seizure_client.rs"

[dependencies]
spl-token-2022-interface = "3"
solana-zk-sdk = "7"
solana-zk-elgamal-proof-interface = "0.1.3"
solana-zk-sdk-pod = "0.1"
spl-token-confidential-transfer-proof-extraction = "0.6"
# The fee variant of the transfer proof set. Confide composes the fee-free proofs itself; the
# with-fee set adds a percentage-with-cap sigma proof and a 2-handle fee validity proof, and
# hand-rolling those would be inventing cryptography this crate already ships.
spl-token-confidential-transfer-proof-generation = "0.6"
# The lender runs the PROGRAM's own predicates against the chain rather than a second
# implementation of them. Two verifiers of the same rule is the drift this repository keeps
# having, and here it would be a lender and a chain disagreeing about whether a loan is safe.
confide-seizure = { path = "../../programs/confide-seizure" }
solana-address = { version = "2", features = ["curve25519", "std"] }
solana-keypair = "3"
solana-signer = "3"
solana-hash = "3"
solana-transaction = { version = "3", features = ["bincode", "serde"] }
solana-message = { version = "3", features = ["serde"] }
solana-instruction = "3"
bincode = "1"
base64 = "0.22"
serde_json = "1"
