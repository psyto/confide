[package]
name = "mora-onchain"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Submit the sealed obligation's own proof to Solana's live ZK ElGamal Proof Program"

[[bin]]
name = "devnet-verify"
path = "src/main.rs"

[[bin]]
name = "anchor-receipt"
path = "src/anchor.rs"

[[bin]]
name = "bind-account"
path = "src/bind.rs"

[dependencies]
mora-equity = { path = "../mora-equity" }
solana-zk-sdk = "7"
solana-zk-elgamal-proof-interface = "0.1.3"
solana-transaction = { version = "3", features = ["bincode", "serde"] }
solana-message = { version = "3", features = ["serde"] }
solana-address = { version = "2", features = ["curve25519", "std"] }
bytemuck = "1"
base64 = "0.22"
bincode = "1"
mora-embargo = { path = "../mora-embargo" }
solana-keypair = "3"
solana-signer = "3"
solana-hash = "3"
solana-instruction = "3"
aperture-core = { git = "https://github.com/psyto/aperture", tag = "v0.5.1" }
serde_json = "1"
